name: aether_fit
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  iconsax: ^0.0.8
  gap: ^3.0.1
  syncfusion_flutter_gauges: ^33.2.7
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
      - assets/images/
      - assets/svg/

  fonts:
      - family: mons
        fonts:
          - asset: assets/font/Montserrat-Regular.ttf
      - family: poppins
        fonts:
          - asset: assets/font/Poppins-Regular.ttf
